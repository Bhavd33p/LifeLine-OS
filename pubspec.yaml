name: personal_os
description: A local-first personal operating system — tasks, habits, finance, health, and calendar in one app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Local storage (device-only, no backend) ────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── State management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Utilities ────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.0

  # ── Reminders ────────────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^1.1.0

  # ── Backup / restore ─────────────────────────────────────────────────────────
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
